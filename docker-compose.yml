version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  pg14:
    image: postgres:14
    container_name: pg14
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: postgres
    volumes:
      - ./docker/data/pg14:/var/lib/postgresql/data
    restart: unless-stopped